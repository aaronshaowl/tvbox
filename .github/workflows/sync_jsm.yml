name: Sync TVBox Config

on:
  schedule:
    - cron: '0 */6 * * *'   # 每6小时同步一次
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest jsm.json
        run: |
          curl -L \
          https://raw.githubusercontent.com/qist/tvbox/master/jsm.json \
          -o my_TVBox.json

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add my_TVBox.json

          git diff --staged --quiet || (
            git commit -m "Auto sync TVBox source"
            git push
          )
